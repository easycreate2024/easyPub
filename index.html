<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四大维度天赋测评 - 找到你的天赋职业</title>
<style>
  :root {
    --primary: #6C5CE7;
    --primary-light: #a29bfe;
    --secondary: #00cec9;
    --accent: #fd79a8;
    --bg: #0a0a1a;
    --card-bg: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.1);
    --text: #e0e0e0;
    --text-light: #999;
    --success: #00b894;
    --warning: #fdcb6e;
    --danger: #e17055;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* animated background */
  body::before {
    content: '';
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(0,206,201,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(253,121,168,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app-container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 20px;
  }
  .header h1 {
    font-size: 28px;
    background: linear-gradient(135deg, var(--primary-light), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .header .subtitle {
    color: var(--text-light);
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 4px;
  }

  /* Progress Bar */
  .progress-wrapper {
    padding: 10px 0 20px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
    width: 0%;
  }

  /* Section Indicator */
  .section-indicators {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 0 0 20px;
  }
  .section-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    background: rgba(255,255,255,0.05);
    color: var(--text-light);
    border: 1px solid transparent;
    transition: all 0.4s;
  }
  .section-dot.active {
    background: rgba(108,92,231,0.2);
    border-color: var(--primary);
    color: var(--primary-light);
  }
  .section-dot.done {
    background: rgba(0,206,201,0.15);
    border-color: var(--secondary);
    color: var(--secondary);
  }
  .section-dot .num {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.1);
  }
  .section-dot.active .num { background: var(--primary); color: #fff; }
  .section-dot.done .num { background: var(--secondary); color: #fff; }

  /* Page container */
  .page {
    display: none;
    animation: fadeIn 0.5s ease;
  }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* Welcome Page */
  .welcome-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .welcome-card .icon { font-size: 64px; margin-bottom: 20px; }
  .welcome-card h2 { font-size: 24px; margin-bottom: 12px; }
  .welcome-card p {
    color: var(--text-light);
    line-height: 1.8;
    font-size: 14px;
    max-width: 500px;
    margin: 0 auto;
  }
  .welcome-card .methods {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 24px auto;
    max-width: 500px;
  }
  .method-tag {
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
    transition: all 0.3s;
  }
  .method-tag:hover {
    background: rgba(108,92,231,0.1);
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .method-tag .label { font-weight: 700; color: var(--primary-light); }
  .method-tag .desc { color: var(--text-light); font-size: 12px; margin-top: 4px; }

  .btn {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    background: linear-gradient(135deg, var(--primary), #8B5CF6);
    color: #fff;
    letter-spacing: 1px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(108,92,231,0.4);
  }
  .btn:active { transform: translateY(0); }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid var(--card-border);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.12);
    box-shadow: none;
  }
  .btn-sm {
    padding: 10px 24px;
    font-size: 14px;
  }

  /* Question Card */
  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(10px);
  }
  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .question-section-label {
    font-size: 12px;
    color: var(--primary-light);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .question-number {
    font-size: 13px;
    color: var(--text-light);
  }
  .question-text {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 28px;
    font-weight: 500;
  }
  .question-dimension {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    padding: 14px 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all 0.3s;
    font-size: 15px;
    position: relative;
  }
  .option:hover {
    border-color: rgba(108,92,231,0.3);
    background: rgba(108,92,231,0.05);
  }
  .option.selected {
    border-color: var(--primary);
    background: rgba(108,92,231,0.12);
  }

  /* Likert Scale */
  .likert-options {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-top: 10px;
  }
  .likert-option {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all 0.3s;
    font-size: 13px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .likert-option .value {
    font-size: 18px;
    font-weight: 700;
  }
  .likert-option:hover {
    border-color: rgba(108,92,231,0.3);
    background: rgba(108,92,231,0.05);
  }
  .likert-option.selected {
    border-color: var(--primary);
    background: rgba(108,92,231,0.15);
    color: var(--primary-light);
  }
  .likert-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-light);
    margin-bottom: 4px;
    padding: 0 4px;
  }

  /* MBTI forced choice */
  .mbti-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .mbti-option {
    padding: 18px;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
  }
  .mbti-option:hover {
    border-color: rgba(108,92,231,0.3);
    background: rgba(108,92,231,0.05);
  }
  .mbti-option.selected {
    border-color: var(--primary);
    background: rgba(108,92,231,0.15);
    box-shadow: 0 0 20px rgba(108,92,231,0.15);
  }
  .mbti-option .option-label {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--text);
  }

  /* Navigation */
  .question-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    gap: 12px;
  }

  /* Name Prompt */
  .name-prompt {
    text-align: center;
    padding: 40px 20px;
  }
  .name-prompt-icon {
    font-size: 56px;
    margin-bottom: 16px;
  }
  .name-prompt h2 {
    font-size: 26px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--primary-light), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .name-input-wrapper {
    max-width: 340px;
    margin: 0 auto 20px;
  }
  .name-input {
    width: 100%;
    padding: 14px 20px;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    color: #eee;
    font-size: 18px;
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
    box-sizing: border-box;
  }
  .name-input:focus {
    border-color: var(--primary);
  }
  .name-input::placeholder {
    color: rgba(255,255,255,0.3);
    font-size: 16px;
  }

  /* Result Page */
  .result-section {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }
  .result-section h2 {
    font-size: 20px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--primary-light), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .result-section h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: var(--primary-light);
  }
  .result-section .score-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
  }
  .result-section .score-row:last-child { border-bottom: none; }
  .result-section .score-label { color: var(--text-light); }
  .result-section .score-value { font-weight: 600; }
  .result-section .score-bar-bg {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .result-section .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1s ease;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
  }

  .career-card {
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    background: rgba(0,206,201,0.08);
    border: 1px solid rgba(0,206,201,0.15);
  }
  .career-card h4 {
    color: var(--secondary);
    margin-bottom: 6px;
    font-size: 16px;
  }
  .career-card p {
    color: var(--text-light);
    font-size: 13px;
    line-height: 1.7;
  }
  .career-card.bad {
    background: rgba(225,112,85,0.08);
    border-color: rgba(225,112,85,0.15);
  }
  .career-card.bad h4 { color: var(--accent); }

  .tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    background: rgba(108,92,231,0.15);
    color: var(--primary-light);
    margin: 2px 4px 2px 0;
  }

  /* Summary */
  .summary-box {
    padding: 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(108,92,231,0.1), rgba(0,206,201,0.1));
    border: 1px solid rgba(108,92,231,0.2);
    margin: 16px 0;
    text-align: center;
  }
  .summary-box .big-text {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .summary-box p {
    color: var(--text-light);
    font-size: 14px;
    line-height: 1.7;
  }

  /* Canvas */
  .chart-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }
  #radarChart {
    max-width: 100%;
    height: auto;
  }

  /* Result compact styles */
  .section-title { font-size:18px; font-weight:700; margin-bottom:14px; }
  .section-title .icon { margin-right:8px; }
  .dim-row { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:14px; }
  .dim-label { min-width:80px; color:var(--text-light); }
  .dim-bar-bg { flex:1; height:8px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; }
  .dim-bar-fill { height:100%; border-radius:4px; transition:width 1s ease; background:linear-gradient(90deg, var(--primary), var(--secondary)); }
  .dim-value { min-width:36px; text-align:right; font-weight:600; color:var(--primary-light); }
  .pf-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .pf-grid .dim-row { padding:4px 0; font-size:13px; }

  /* Type Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-radius: 30px;
    background: linear-gradient(135deg, var(--primary), #8B5CF6);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 10px 0;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .app-container { padding: 12px; }
    .welcome-card { padding: 24px 16px; }
    .question-card { padding: 20px 16px; }
    .question-text { font-size: 16px; }
    .mbti-options { grid-template-columns: 1fr; }
    .likert-option { font-size: 11px; padding: 8px 2px; min-height: 50px; }
    .likert-option .value { font-size: 16px; }
    .section-indicators { gap: 6px; flex-wrap: wrap; }
    .section-dot { padding: 4px 10px; font-size: 11px; }
    .result-section { padding: 20px 16px; }
    .header h1 { font-size: 22px; }
    .methods { grid-template-columns: 1fr !important; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* Transition helpers */
  .hidden { display: none !important; }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
  }
  .loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- Header -->
  <div class="header">
    <h1>✦ 四大维度天赋测评</h1>
    <div class="subtitle">MBTI · 霍兰德 · 大五人格 · 卡特尔16PF</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrapper" id="progressWrapper" style="display:none">
    <div class="progress-info">
      <span id="progressLabel">MBTI 测试</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Section Indicators -->
  <div class="section-indicators" id="sectionIndicators" style="display:none">
    <div class="section-dot active" data-section="0">
      <span class="num">1</span> MBTI
    </div>
    <div class="section-dot" data-section="1">
      <span class="num">2</span> 霍兰德
    </div>
    <div class="section-dot" data-section="2">
      <span class="num">3</span> 大五人格
    </div>
    <div class="section-dot" data-section="3">
      <span class="num">4</span> 16PF
    </div>
  </div>

  <!-- ============ PAGE: WELCOME ============ -->
  <div class="page active" id="pageWelcome">
    <div class="welcome-card">
      <div class="icon">🧬</div>
      <h2>发现你的天赋职业</h2>
      <p>本测试融合了心理学四大经典测评体系，从性格类型、职业兴趣、人格特质、深层心理四个维度全面分析你的天赋特质，精准定位最适合你的职业方向。</p>
      <div class="methods">
        <div class="method-tag"><div class="label">🧠 MBTI</div><div class="desc">16型人格 · 性格偏好</div></div>
        <div class="method-tag"><div class="label">🛠️ 霍兰德</div><div class="desc">RIASEC · 职业兴趣</div></div>
        <div class="method-tag"><div class="label">🌊 大五人格</div><div class="desc">OCEAN · 核心特质</div></div>
        <div class="method-tag"><div class="label">🔬 16PF</div><div class="desc">卡特尔 · 深层心理</div></div>
      </div>
      <p style="color:var(--text-light);font-size:13px;margin-bottom:20px;">
        ⏱ 共 96 题 · 约 15-20 分钟 · 请按第一反应作答
      </p>
      <button class="btn" onclick="startTest()">开始测试 →</button>
    </div>
  </div>

  <!-- ============ PAGE: TEST ============ -->
  <div class="page" id="pageTest">
    <div class="question-card" id="questionCard">
      <div id="questionContent"></div>
      <div class="question-nav">
        <button class="btn btn-secondary btn-sm" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
      </div>
    </div>
  </div>

  <!-- ============ PAGE: RESULT ============ -->
  <div class="page" id="pageResult">
    <div id="resultContent"></div>
  </div>
</div>

<script>
// ===================================================================
//  DATA: All Questions
// ===================================================================

const SECTIONS = [
  { key: 'mbti', label: 'MBTI 性格类型', short: 'MBTI' },
  { key: 'holland', label: '霍兰德职业兴趣', short: '霍兰德' },
  { key: 'bigfive', label: '大五人格', short: '大五' },
  { key: 'pf16', label: '卡特尔16PF', short: '16PF' },
];

// ---------- MBTI (20 questions, forced choice) ----------
const MBTI_DIMS = [
  { key: 'EI', labelA: '外向 (E)', labelB: '内向 (I)', questions: [
    { text: '和朋友在一起让我感到精力充沛', descA: '社交让我充满能量', descB: '独处才能给我充电' },
    { text: '我喜欢成为聚会/会议中的焦点', descA: '我享受被关注的感觉', descB: '我更愿意低调旁观' },
    { text: '我更倾向于团队讨论来理清思路', descA: '和别人讨论让我思路更清晰', descB: '我需要独自安静思考' },
    { text: '我交友广泛，喜欢与不同类型的人来往', descA: '我喜欢广泛的社交圈', descB: '我只有少数几位知己' },
    { text: '我说话时倾向于边想边说', descA: '说着说着思路才清晰', descB: '想好了再开口' },
  ]},
  { key: 'SN', labelA: '感觉 (S)', labelB: '直觉 (N)', questions: [
    { text: '我关注具体细节和实际经验', descA: '我习惯关注看得见摸得着的细节', descB: '我更关注整体模式和可能性' },
    { text: '我更相信眼见为实的事实依据', descA: '事实和数据才能让我信服', descB: '我相信直觉和第六感' },
    { text: '我更注重当下的情况和实际问题', descA: '先管好眼前的事', descB: '我更关注未来的可能性' },
    { text: '我喜欢按部就班、稳妥可靠的方法', descA: '我偏好熟悉且可靠的做法', descB: '我更喜欢尝试新的方法' },

// ===================================================================
//  Build flat question list
// ===================================================================

function buildQuestions() {
  const all = [];
  let idx = 0;

  // MBTI
  MBTI_DIMS.forEach(dim => {
    dim.questions.forEach((q, qi) => {
      const isObj = typeof q === 'object';
      all.push({
        id: idx++,
        section: 0,
        sectionKey: 'mbti',
        type: 'mbti',
        dim: dim.key,
        dimLabel: dim.labelA + ' vs ' + dim.labelB,
        text: isObj ? q.text : q,
        optionA: dim.labelA,
        optionB: dim.labelB,
        descA: isObj ? q.descA : '',
        descB: isObj ? q.descB : '',
      });
    });
  });

  // Holland
  HOLLAND_TYPES.forEach(type => {
    type.questions.forEach(q => {
      all.push({
        id: idx++,
        section: 1,
        sectionKey: 'holland',
        type: 'likert5',
        dim: type.key,
        dimLabel: type.label,
        text: q,
      });
    });
  });

  // Big Five
  BIGFIVE_DIMS.forEach(dim => {
    dim.questions.forEach(q => {
      all.push({
        id: idx++,
        section: 2,
        sectionKey: 'bigfive',
        type: 'likert5',
        dim: dim.key,
        dimLabel: dim.label,
        reverse: dim.reverse,
        text: q,
      });
    });
  });

  // 16PF
  PF16_FACTORS.forEach(f => {
    f.questions.forEach(q => {
      all.push({
        id: idx++,
        section: 3,
        sectionKey: 'pf16',
        type: 'likert5',
        dim: f.key,
        dimLabel: f.label + ' · ' + f.desc,
        reverse: f.reverse,
        text: q,
      });
    });
  });

  return all;
}

const QUESTIONS = buildQuestions();
const TOTAL = QUESTIONS.length;

// ===================================================================
//  State
// ===================================================================

let state = {
  current: 0,
  answers: new Array(TOTAL).fill(null),
  started: false,
};

// ===================================================================
//  DOM refs
// ===================================================================

const $ = id => document.getElementById(id);
const pageWelcome = $('pageWelcome');
const pageTest = $('pageTest');
const pageResult = $('pageResult');
const progressWrapper = $('progressWrapper');
const sectionIndicators = $('sectionIndicators');
const progressFill = $('progressFill');
const progressLabel = $('progressLabel');
const progressPercent = $('progressPercent');
const questionContent = $('questionContent');
const prevBtn = $('prevBtn');

// ===================================================================
//  Navigation
// ===================================================================

function startTest() {
  state.started = true;
  state.current = 0;
  state.answers = new Array(TOTAL).fill(null);
  pageWelcome.classList.remove('active');
  pageTest.classList.add('active');
  progressWrapper.style.display = 'block';
  sectionIndicators.style.display = 'flex';
  renderQuestion();
  updateProgress();
}

function renderQuestion() {
  const q = QUESTIONS[state.current];
  const sec = SECTIONS[q.section];
  const answered = state.answers[q.id];
  const sectionTotal = QUESTIONS.filter(x => x.section === q.section).length;
  const sectionIdx = QUESTIONS.filter(x => x.section === q.section).indexOf(q) + 1;

  progressLabel.textContent = `${sec.short} (${sectionIdx}/${sectionTotal})`;
  updateSectionIndicators();

  if (q.type === 'mbti') {
    renderMBTI(q, answered);
  } else {
    renderLikert(q, answered);
  }

  prevBtn.style.visibility = q.id === 0 ? 'hidden' : 'visible';
}

function renderMBTI(q, answered) {
  questionContent.innerHTML = `
    <div class="question-header">
      <span class="question-section-label">MBTI · ${q.dim}维度</span>
      <span class="question-number">${q.id + 1} / ${TOTAL}</span>
    </div>
    <div class="question-dimension">${q.dimLabel}</div>
    <div class="question-text">${q.text}</div>
    <div class="mbti-options">
      <div class="mbti-option ${answered === 'A' ? 'selected' : ''}" data-value="A" onclick="answer(${q.id},'A')">
        <div class="option-label">${q.descA}</div>
      </div>
      <div class="mbti-option ${answered === 'B' ? 'selected' : ''}" data-value="B" onclick="answer(${q.id},'B')">
        <div class="option-label">${q.descB}</div>
      </div>
  `;
}

function renderLikert(q, answered) {
  const labels = ['非常不符合', '比较不符合', '不确定', '比较符合', '非常符合'];
  let optionsHTML = labels.map((l, i) => {
    const val = i + 1;
    const sel = answered === val ? 'selected' : '';
    return `<div class="likert-option ${sel}" data-value="${val}" onclick="answer(${q.id},${val})">
      <span class="value">${val}</span>
      <span>${l}</span>
    </div>`;
  }).join('');

  const sectionName = SECTIONS[q.section].short;
  questionContent.innerHTML = `
    <div class="question-header">
      <span class="question-section-label">${sectionName} · ${q.dimLabel}</span>
      <span class="question-number">${q.id + 1} / ${TOTAL}</span>
    </div>
    <div class="question-text">${q.text}</div>
    <div class="likert-labels">
      <span>非常不符合</span>
      <span>比较不符合</span>
      <span>不确定</span>
      <span>比较符合</span>
      <span>非常符合</span>
    </div>
    <div class="likert-options">
      ${optionsHTML}
    </div>
  `;
}

function answer(id, val) {
  state.answers[id] = val;
  // Update UI
  const container = questionContent;
  const prevSelected = container.querySelector('.selected');
  if (prevSelected) prevSelected.classList.remove('selected');
  const newSelected = container.querySelector(`[data-value="${val}"]`);
  if (newSelected) newSelected.classList.add('selected');
  updateProgress();
  // Auto advance after brief visual feedback (guard: only if still on this question)
  setTimeout(() => {
    if (id === TOTAL - 1) {
      showNamePrompt();
    } else if (state.current === id) {
      state.current++;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }, 200);
}

function prevQuestion() {
  if (state.current <= 0) return;
  state.current--;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// keyboard support
document.addEventListener('keydown', e => {
  if (!state.started) return;
  if (e.key === 'ArrowLeft') prevQuestion();
});

// ===================================================================
//  Progress
// ===================================================================

function updateProgress() {
  const answered = state.answers.filter(a => a !== null).length;
  const pct = Math.round((answered / TOTAL) * 100);
  progressFill.style.width = pct + '%';
  progressPercent.textContent = pct + '% （' + answered + '/' + TOTAL + '题）';
  updateSectionIndicators();
}

function updateSectionIndicators() {
  const dots = document.querySelectorAll('.section-dot');
  const curSection = state.started ? QUESTIONS[state.current].section : 0;
  dots.forEach((dot, i) => {
    dot.classList.remove('active', 'done');
    if (i < curSection) dot.classList.add('done');
    else if (i === curSection) dot.classList.add('active');
  });
}

// ===================================================================
//  RESULT COMPUTATION
// ===================================================================

function computeScores() {
  const res = {};

  // --- MBTI ---
  res.mbti = { EI: 0, SN: 0, TF: 0, JP: 0 };
  MBTI_DIMS.forEach(dim => {
    dim.questions.forEach((_, qi) => {
      // find the question
      const q = QUESTIONS.find(q => q.section === 0 && q.dim === dim.key && QUESTIONS.filter(x => x.section === 0 && x.dim === dim.key).indexOf(q) === qi);
      if (!q) return;
      const ans = state.answers[q.id];
      if (ans === 'A') res.mbti[dim.key] += 1; // count A = first type
      // B = 0, so just count A's
    });
  });
  // MBTI type string
  const mbtiType = (res.mbti.EI >= 3 ? 'E' : 'I') + (res.mbti.SN >= 3 ? 'S' : 'N') + (res.mbti.TF >= 3 ? 'T' : 'F') + (res.mbti.JP >= 3 ? 'J' : 'P');
  res.mbtiType = mbtiType;
  res.mbtiScores = { E: res.mbti.EI, I: 5 - res.mbti.EI, S: res.mbti.SN, N: 5 - res.mbti.SN, T: res.mbti.TF, F: 5 - res.mbti.TF, J: res.mbti.JP, P: 5 - res.mbti.JP };

  // --- Holland ---
  res.holland = {};
  HOLLAND_TYPES.forEach(type => {
    let sum = 0;
    type.questions.forEach((_, qi) => {
      const q = QUESTIONS.find(q => q.section === 1 && q.dim === type.key && QUESTIONS.filter(x => x.section === 1 && x.dim === type.key).indexOf(q) === qi);
      if (!q) return;
      const ans = state.answers[q.id];
      if (ans) sum += ans;
    });
    res.holland[type.key] = sum / type.questions.length;
  });

  // Holland top 3
  const sortedHolland = Object.entries(res.holland).sort((a,b) => b[1] - a[1]);
  res.hollandCode = sortedHolland.slice(0,3).map(x => x[0]).join('');

  // --- Big Five ---
  res.bigfive = {};
  BIGFIVE_DIMS.forEach(dim => {
    let sum = 0;
    dim.questions.forEach((_, qi) => {
      const q = QUESTIONS.find(q => q.section === 2 && q.dim === dim.key && QUESTIONS.filter(x => x.section === 2 && x.dim === dim.key).indexOf(q) === qi);
      if (!q) return;
      let ans = state.answers[q.id];
      if (ans === null) ans = 3;
      if (dim.reverse) ans = 6 - ans;
      sum += ans;
    });
    res.bigfive[dim.key] = sum / dim.questions.length;
  });

  // --- 16PF ---
  res.pf16 = {};
  PF16_FACTORS.forEach(f => {
    let sum = 0;
    f.questions.forEach((_, qi) => {
      const q = QUESTIONS.find(q => q.section === 3 && q.dim === f.key && QUESTIONS.filter(x => x.section === 3 && x.dim === f.key).indexOf(q) === qi);
      if (!q) return;
      let ans = state.answers[q.id];
      if (ans === null) ans = 3;
      if (f.reverse) ans = 6 - ans;
      sum += ans;
    });
    res.pf16[f.key] = sum / f.questions.length;
  });

  return res;
}

function generateReport() {
  const input = document.getElementById('userNameInput');
  if (!input) return;
  const name = input.value.trim();
  if (!name) {
    input.style.borderColor = '#e74c3c';
    input.placeholder = '⚠️ 请先输入姓名';
    setTimeout(() => { input.style.borderColor = ''; input.placeholder = '请输入你的姓名'; }, 2000);
    return;
  }
  userName = name;
  showResult();
}

  md += `## 💡 综合建议\n\n`;
  md += `${displayName}，你的 MBTI 类型为 **${r.mbtiType}**（${getMBTIDescription(r.mbtiType)}），`;
  md += `霍兰德代码为 **${r.hollandCode}**，`;
  md += `大五人格中突出的特质是 ${bfProfile.filter(p => p.val >= 3.5).map(p => p.label).join('、')}。\n\n`;
  md += `最适合你的职业方向应该是能够发挥你的性格优势、同时满足你的职业兴趣的工作。`;
  md += `建议重点关注"推荐职业 Top 3"中的方向，并结合你的教育背景和实际经验综合考虑。\n\n`;
  md += `---\n\n`;
  md += `*报告由四大维度天赋测评系统生成*  `;

  // ============================================================
  //  附加：答题记录（问题和用户答案）
  // ============================================================
  md += `\n\n---\n\n`;
  md += `## 📝 答题记录\n\n`;
  md += `以下是你在测评中回答的全部问题：\n\n`;

  const SECTION_NAMES = ['🧠 MBTI', '🛠️ 霍兰德', '🌊 大五人格', '🔬 卡特尔16PF'];
  const LIKERT_LABELS = ['非常不符合', '比较不符合', '不确定', '比较符合', '非常符合'];

  QUESTIONS.forEach((q, i) => {
    const sectionName = SECTION_NAMES[q.section] || '';
    const ans = state.answers[q.id];
    let ansText = '⏺ 未作答';

    if (ans !== null && ans !== undefined) {
      if (q.type === 'mbti') {
        ansText = ans === 'A' ? q.descA : q.descB;
      } else {
        const label = LIKERT_LABELS[ans - 1];
        ansText = label ? `${ans} - ${label}` : `评分 ${ans}`;
      }
    }

    md += `**Q${i + 1}.** [${sectionName}] ${q.text}\n\n`;
    md += `> 你的回答：${ansText}\n\n`;
  });

  // 下载 .md 文件
  const filename = `${displayName}_天赋测评报告_${new Date().toISOString().slice(0,10)}.md`;
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);

  showSaveToast();
}

function showSaveToast() {
  const existing = document.querySelector('.save-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'save-toast';
  toast.innerHTML = '✅ 已下载！可在电脑「下载」文件夹中找到 .md 文件';
  toast.style.cssText = `
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: #1a2332; color: #eee; padding: 14px 28px; border-radius: 12px;
    border: 1px solid rgba(100,255,218,0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    font-size: 14px; z-index: 1000; animation: fadeInUp 0.3s ease;
    text-align: center; max-width: 90vw;
  `;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 4000);
}

// ===================================================================
//  Radar Chart (Canvas)
// ===================================================================

function drawRadarChart(hollandScores) {
  const canvas = document.getElementById('radarChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 300, H = 300, cx = W/2, cy = H/2, R = 110;

  const labels = ['R\n现实型', 'I\n研究型', 'A\n艺术型', 'S\n社会型', 'E\n企业型', 'C\n常规型'];
  const keys = ['R','I','A','S','E','C'];
  const n = 6;
  const maxScore = 5;

  ctx.clearRect(0, 0, W, H);

  // --- 背景网格 ---
  for (let ring = 1; ring <= 5; ring++) {
    const r = (R / 5) * ring;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI/2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // --- 轴向线 ---
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();
  }

  // --- 数据区域 ---
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const val = hollandScores[keys[i]] || 0;
    const r = (val / maxScore) * R;
    const angle = (Math.PI * 2 / n) * i - Math.PI/2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(108,92,231,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#a29bfe';
  ctx.lineWidth = 2;
  ctx.stroke();

  // --- 数据点 ---
  for (let i = 0; i < n; i++) {
    const val = hollandScores[keys[i]] || 0;
    const r = (val / maxScore) * R;
    const angle = (Math.PI * 2 / n) * i - Math.PI/2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#a29bfe';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // --- 标签 ---
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI/2;
    const labelR = R + 24;
    const x = cx + labelR * Math.cos(angle);
    const y = cy + labelR * Math.sin(angle);
    const lines = labels[i].split('\n');
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    lines.forEach((line, li) => {
      ctx.fillText(line, x, y + (li - (lines.length-1)/2) * 14);
    });

    // 显示分值
    const val = hollandScores[keys[i]] || 0;
    const valR = (val / maxScore) * R;
    const vx = cx + valR * Math.cos(angle);
    const vy = cy + valR * Math.sin(angle);
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#a29bfe';
    ctx.fillText(val.toFixed(1), vx, vy - 10);
  }
}

// Restart
function restartTest() {
  pageResult.classList.remove('active');
  pageWelcome.classList.add('active');
  state.started = false;
  state.current = 0;
  state.answers = new Array(TOTAL).fill(null);
}
